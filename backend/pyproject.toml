[project]
name = "canvas-server"
version = "0.1.0"
description = "Canvas agent server backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "websockets>=14.1",
    "dspy>=3.1.0",
    "mem0ai>=2.0.4",
    "ollama>=0.4",
    "mlflow-skinny>=2.20.0",
    "pandas>=2.0.0",
    "llm-sandbox[docker]>=0.3.39",
    "pgvector>=0.2.5",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 needs to read bcrypt's version (bcrypt<4 ships __about__)
    # so it can skip its broken detect_wrap_bug probe against modern bcrypt.
    "bcrypt<4",
]

[dependency-groups]
dev = ["ruff>=0.15.12"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # formatter handles line length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
known-first-party = ["canvas_server"]

[tool.ruff.lint.per-file-ignores]
"src/canvas_server/auth.py" = ["B008"]
"src/canvas_server/routes/canvas.py" = ["B008"]
"src/canvas_server/routes/auth.py" = ["B008"]
"src/canvas_server/routes/settings.py" = ["B008"]
"src/canvas_server/routes/execute.py" = ["B008", "SIM105"]
"tests/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
canvas-worker = "canvas_server.worker_main:main"
