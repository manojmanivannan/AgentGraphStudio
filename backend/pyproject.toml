[project]
name = "canvas-server"
version = "0.1.0"
description = "Canvas agent server backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "websockets>=14.1",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22.1",
    "dspy>=3.1.0",
    "mem0ai[nlp]>=2.0.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "ollama>=0.4",
    "fastembed>=0.8.0",
    "mlflow>=2.20.0",
    "llm-sandbox[docker]>=0.3.39",
    "pgvector>=0.2.5",
]

[dependency-groups]
dev = ["ruff>=0.15.12"]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto --dist loadscope"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # formatter handles line length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
known-first-party = ["canvas_server"]

[tool.ruff.lint.per-file-ignores]
"src/canvas_server/routes/canvas.py" = ["B008"]
"src/canvas_server/routes/execute.py" = ["SIM105"]
"tests/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
canvas-worker = "canvas_server.worker_main:main"
