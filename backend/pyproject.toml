[project]
name = "canvas-server"
version = "0.1.0"
description = "Canvas agent server backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "beeai-framework>=0.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "websockets>=14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: slow end-to-end tests that require a running Ollama instance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
