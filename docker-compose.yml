configs:
  ollama-entry:
    content: |
      # Source - https://stackoverflow.com/a/78501628
      # Posted by datawookie
      # Retrieved 2026-05-09, License - CC BY-SA 4.0
      #!/bin/bash
      # Start Ollama in the background.
      /bin/ollama serve &
      # Record Process ID.
      pid=$$!
      # Pause for Ollama to start.
      sleep 5
      # Parse LLM Model from environment variable
      llm_name=""
      if [ -n "$$LLM_MODEL" ]; then
        if [[ $$LLM_MODEL == */* ]]; then
          if [[ $$LLM_MODEL == ollama_chat/* ]]; then
              llm_name="$${LLM_MODEL#ollama_chat/}"
          elif [[ $$LLM_MODEL == ollama/* ]]; then
              llm_name="$${LLM_MODEL#ollama/}"
          fi
        else
          llm_name="$$LLM_MODEL"
        fi
      fi
      # Fallback to default if no valid Ollama LLM model was configured
      if [ -z "$$llm_name" ]; then
        llm_name="gemma4:31b"
      fi
      # Parse Embedder Model from environment variable
      embedder_name=""
      if [ -n "$$MEM0_EMBEDDER_MODEL" ]; then
        if [[ $$MEM0_EMBEDDER_MODEL == */* ]]; then
          if [[ $$MEM0_EMBEDDER_MODEL == ollama_chat/* ]]; then
              embedder_name="$${MEM0_EMBEDDER_MODEL#ollama_chat/}"
          elif [[ $$MEM0_EMBEDDER_MODEL == ollama/* ]]; then
              embedder_name="$${MEM0_EMBEDDER_MODEL#ollama/}"
          fi
        else
          embedder_name="$$MEM0_EMBEDDER_MODEL"
        fi
      fi
      echo "🔴 Retrieve LLM model: $$llm_name..."
      ollama pull "$$llm_name"
      if [ -n "$$embedder_name" ]; then
        echo "🔴 Retrieve Embedder model: $$embedder_name..."
        ollama pull "$$embedder_name"
      fi
      echo "🟢 Done!"
      # Wait for Ollama process to finish.
      wait $$pid

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file: ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      EXECUTION_MODE: ${BACKEND_EXECUTION_MODE}
    extra_hosts:
      - "host.docker.internal:host-gateway" # for instantiating sandboxes
    networks:
      - agent_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - qdrant_data:/tmp/qdrant
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/requirements.txt

  execution-worker:
    build:
      context: ./backend
    command: ["uv", "run", "python", "-m", "canvas_server.worker_main"]
    env_file: ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      EXECUTION_MODE: ${WORKER_EXECUTION_MODE}
      HF_TOKEN: ${HF_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - qdrant_data:/tmp/qdrant
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/requirements.txt

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file: ./.env
    environment:
      VITE_USE_PROXY: ${VITE_USE_PROXY}
      VITE_API_HOST: ${VITE_API_HOST}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
      MLFLOW_PROXY_TARGET: ${MLFLOW_PROXY_TARGET}
    networks:
      - agent_network
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json

  mlflow:
    build:
      context: ./mlflow
    ports:
      - "5000:5000"
    env_file: ./.env
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    volumes:
      - mlflow_data:/app/mlflow
    networks:
      - agent_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles:
      - gpu
    ports:
      - "11434:11434"
    configs:
      - source: ollama-entry
        target: /entrypoint.sh
        mode: 0755
    volumes:
      - ollama_data:/root/.ollama
      # - ./ollama_entrypoint.sh:/entrypoint.sh
    env_file: ./.env
    tty: true
    restart: always
    networks:
      - agent_network
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  agent_network:
    driver: bridge

volumes:
  pgdata:
  mlflow_data:
  ollama_data:
  qdrant_data:
