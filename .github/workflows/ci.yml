name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group test

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Type check (pyright)
        working-directory: backend
        run: uv run pyright src/canvas_server

      - name: Test
        working-directory: backend
        run: uv run pytest tests/ -v --junitxml=junit/test-results.xml

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/junit/test-results.xml
          comment_title: Backend Tests (pytest)
          check_name: Backend Tests (pytest)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/junit/

  frontend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Exact minimum Node release fixing CVE-2026-111497.
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit & component tests (fast, no coverage)
        working-directory: frontend
        run: npx vitest run --pool=threads

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/junit/vitest-results.xml
          comment_title: Frontend Unit Tests (vitest)
          check_name: Frontend Unit Tests (vitest)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-results
          path: frontend/junit/

  frontend-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Exact minimum Node release fixing CVE-2026-111497.
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Coverage report
        working-directory: frontend
        run: npx vitest run --coverage --pool=threads

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Exact minimum Node release fixing CVE-2026-111497.
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group test

      - name: Run E2E tests
        working-directory: frontend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e_test.db
          MLFLOW_ENABLED: "false"
        run: npm run test:e2e

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/junit/e2e-results.xml
          comment_title: Frontend E2E Tests (Playwright)
          check_name: Frontend E2E Tests (Playwright)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-test-results
          path: frontend/junit/

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, mlflow, sandbox, mcp-weather]
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.image }} image
        run: docker build -t local/${{ matrix.image }}:scan ${{ matrix.image }}

      - name: Scan ${{ matrix.image }} image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only while the pre-existing dependency baseline is triaged.
          # Flip back to 1 once the findings tracked in the follow-up issue are
          # fixed; see PR #149 discussion.
          exit-code: 0
          format: table
          output: trivy-${{ matrix.image }}.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
          if-no-files-found: warn

  container-scan-summary:
    needs: [container-scan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download Trivy reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: trivy-*
          path: trivy-reports
          merge-multiple: true

      - name: Build summary
        run: |
          {
            echo "<!-- container-scan-summary -->"
            echo "## Container scan summary"
            echo ""
            echo "Trivy scans the five first-party images on every PR. The job is"
            echo "report-only while the dependency baseline is triaged (#150)."
            echo ""
            if compgen -G "trivy-reports/*.txt" > /dev/null; then
              for report in trivy-reports/*.txt; do
                image="$(basename "$report" .txt)"
                image="${image#trivy-}"
                echo "<details><summary><code>${image}</code></summary>"
                echo ""
                echo '```'
                sed -e 's/\x1b\[[0-9;]*m//g' "$report"
                echo '```'
                echo ""
                echo "</details>"
              done
            else
              echo "_No scan reports were produced (an image build may have failed)._"
            fi
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- container-scan-summary -->';
            const body = fs.readFileSync('summary.md', 'utf8');
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
