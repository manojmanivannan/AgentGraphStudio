name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group test

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Test
        working-directory: backend
        run: uv run pytest tests/ -v
