name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group test

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Test
        working-directory: backend
        run: uv run pytest tests/ -v --junitxml=junit/test-results.xml

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/junit/test-results.xml
          comment_title: Backend Tests (pytest)
          check_name: Backend Tests (pytest)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/junit/

  frontend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit & component tests (with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/junit/vitest-results.xml
          comment_title: Frontend Unit Tests (vitest)
          check_name: Frontend Unit Tests (vitest)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-results
          path: frontend/junit/

  frontend-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Run E2E tests
        working-directory: frontend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e_test.db
          MLFLOW_ENABLED: "false"
        run: npm run test:e2e

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/junit/e2e-results.xml
          comment_title: Frontend E2E Tests (Playwright)
          check_name: Frontend E2E Tests (Playwright)

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-test-results
          path: frontend/junit/